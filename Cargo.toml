[package]
name = "salibc"
version = "0.1.0"
edition = "2024"

[dependencies]
libm = "0.2.15"
safa-api = { git = "https://github.com/SafaOS/safa-api", features = ["linkonce"] }
compiler_builtins = { version = "0.1", optional = true }
rand_pcg = "0.10.2"
hashbrown = { version = "0.17.1", default-features=false }
rustc-hash = { version = "2.1.3", default-features = false }

[profile.release]
debug-assertions = true
